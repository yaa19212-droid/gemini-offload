[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-offload-mcp"
version = "0.1.0"
description = "Thin stdio MCP server that offloads Gemini subtasks (OCR / STT / text) for orchestrator agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anyio>=4.0",
    "mcp>=1.0",
    "google-auth>=2.0",
    "google-genai>=1.22.0",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.scripts]
gemini-offload-mcp = "mcp_server:main"

[tool.setuptools.packages.find]
include = ["mcp_server*"]
